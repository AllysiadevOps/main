name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'zk/vectors/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'zk/vectors/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-lint:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true

      - name: Run automated accessibility checks (axe-core)
        run: npm run test:a11y

      - name: Run production build
        run: npm run build

      - name: Set up Python for the coverage checker
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests with coverage
        run: |
          npm install --no-save @vitest/coverage-v8
          npx vitest run --coverage --coverage.reporter=json-summary

      - name: Check frontend coverage thresholds
        run: python3 ../devx/coverage/check_coverage.py --workspace frontend --report coverage/coverage-summary.json
