name: ZK CI

on:
  pull_request:
    paths:
      - "zk/**"
      - "frontend/public/noir/**"
      - "backend/verifier_inputs.py"
      - "backend/test_conformance_vectors.py"
      - "backend/test_verifier_fuzz.py"
      - ".github/workflows/zk-ci.yml"
  push:
    branches:
      - main
    paths:
      - "zk/**"
      - "frontend/public/noir/**"
      - "backend/verifier_inputs.py"
      - "backend/test_conformance_vectors.py"
      - "backend/test_verifier_fuzz.py"
      - ".github/workflows/zk-ci.yml"

permissions:
  contents: read

concurrency:
  group: zk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-tooling:
    name: Artifact manifest tooling
    runs-on: ubuntu-latest
    # Bounded so a hung normalization pass cannot hold a runner indefinitely.
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      SOURCE_DATE_EPOCH: "0"
      TZ: UTC
      LC_ALL: C
      PYTHONHASHSEED: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test runner
        run: pip install pytest

      - name: Unit-test the manifest tool
        run: python -m pytest zk/tools -q

      - name: Unit-test the ZK benchmark harness
        # No nargo/bb required: synthetic drivers exercise schema, privacy,
        # cold/warm aggregation, and deterministic failure modes.
        run: python -m pytest zk/bench -q

      - name: Enforce published proof benchmark thresholds
        # Hermetic gate: synthetic CI prove/verify must stay under
        # zk/bench/baselines.lock.json. No witness/proof material is logged.
        run: |
          mkdir -p zk/bench/results
          zk/bench/run.sh run --target ci --synthetic --out zk/bench/results/ci-gate.json
          zk/bench/run.sh compare --report zk/bench/results/ci-gate.json

      - name: Check the toolchain lock parses and is self-consistent
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "zk/tools")
          import artifact_manifest as am
          lock = am.load_lock(am.DEFAULT_LOCK)
          assert lock.artifacts, "lock declares no artifacts"
          assert any(entry.get("required") for entry in lock.artifacts)
          print(f"lock ok: {len(lock.artifacts)} artifacts, "
                f"nargo {lock.toolchain['nargo']['version']}, "
                f"bb {lock.toolchain['barretenberg']['version']}")
          PY

      - name: Every Noir circuit in the tree is pinned by the lock
        # A circuit that is not declared in zk/toolchain.lock.json is compiled
        # by nobody and digested by nothing, yet can still be published to the
        # browser or verified on chain. Fails in either direction: an
        # undeclared package, or a declared pin whose package is gone. No
        # toolchain required and no artifact is read, so nothing that could
        # carry a witness or a key can reach the log.
        run: python zk/tools/artifact_manifest.py check-coverage

      - name: Verify committed artifacts against the manifest
        # Skipped when no manifest has been committed yet: generated artifacts
        # are not tracked, so this becomes enforcing once a build publishes one.
        run: |
          if [ -f zk/artifacts.manifest.json ]; then
            python zk/tools/artifact_manifest.py verify
          else
            echo "no committed manifest yet; drift check is inert on this branch"
          fi

      - name: Verify published browser ACIR against the browser manifest
        # The browser trust boundary: frontend/public/noir must match the
        # committed zk/browser.artifacts.manifest.json digests. Inert until
        # that manifest is committed. Never logs artifact bytes.
        run: |
          if [ -f zk/browser.artifacts.manifest.json ]; then
            python zk/tools/artifact_manifest.py verify-browser
          else
            echo "no committed browser manifest yet; browser drift check is inert"
          fi

      - name: Verify published circuit artifact provenance
        # Source-digest gate: lock-declared circuit sources must match
        # zk/circuit.provenance.json. Noir/bb not required. Never logs source bytes.
        run: |
          if [ -f zk/circuit.provenance.json ]; then
            python zk/tools/artifact_manifest.py verify-provenance
          else
            echo "no committed circuit provenance yet; provenance check is inert"
          fi

  circuit-build:
    name: Build Noir circuits and verify artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SOURCE_DATE_EPOCH: "0"
      TZ: UTC
      LC_ALL: C
      PYTHONHASHSEED: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Nargo (Noir CLI)
        run: |
          NARGO_VERSION="$(python3 -c "import json; print(json.load(open('zk/toolchain.lock.json'))['toolchain']['nargo']['version'])")"
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/refs/heads/main/install | bash
          export PATH="$HOME/.nargo/bin:$PATH"
          noirup --version "$NARGO_VERSION"
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"

      - name: Install Barretenberg (bb)
        run: |
          BB_VERSION="$(python3 -c "import json; print(json.load(open('zk/toolchain.lock.json'))['toolchain']['barretenberg']['version'])")"
          curl -L https://raw.githubusercontent.com/AztecProtocol/aztec-packages/master/barretenberg/bbup/install | bash
          export PATH="$HOME/.bb:$PATH"
          bbup --version "$BB_VERSION"
          echo "$HOME/.bb" >> "$GITHUB_PATH"
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain versions match lock file
        run: |
          python3 -c "
          import json
          lock = json.load(open('zk/toolchain.lock.json'))
          tc = lock['toolchain']
          expected_nargo = tc['nargo']['version']
          expected_bb = tc['barretenberg']['version']
          print(f'Expecting nargo {expected_nargo}, bb {expected_bb}')
          "
          ACTUAL_NARGO="$(nargo --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?' | head -n1 || true)"
          ACTUAL_BB="$(bb --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          echo "Installed: nargo ${ACTUAL_NARGO}, bb ${ACTUAL_BB}"

      - name: Build circuits and verify against committed manifest
        # Builds all circuits from clean target dirs, generates VKs, then
        # compares against the committed manifest. Fails on any drift.
        run: |
          if [ -f zk/artifacts.manifest.json ]; then
            echo "Committed manifest found; building and verifying..."
            python zk/tools/build_circuits.py build all --verify
          else
            echo "No committed manifest found; building once to generate artifacts..."
            python zk/tools/build_circuits.py build all --single
          fi

      - name: Verify circuit gate and opcode counts against gates.lock.json
        run: |
          python3 zk/bench/gates.py check --summary "$GITHUB_STEP_SUMMARY"

      - name: Test the redacted derivative ancestry circuits
        # Focused positive / negative / boundary corpus for the new
        # redacted_ancestry circuit (#356). Assert codes never echo witness
        # values, so test output stays privacy-safe.
        run: |
          ( cd zk/noir/redacted_ancestry && nargo test )
          ( cd zk/noir/redacted_ancestry_helper && nargo test )

      - name: Test the silent witness circuits
        # #368 added the public `circuit_version` input that the circuit asserts
        # against CURRENT_CIRCUIT_VERSION in-circuit. Without this step nothing in
        # CI ever ran that assertion, so a proof built from a stale circuit could
        # claim a version the statement does not commit to.
        run: |
          ( cd zk/noir/silent_witness && nargo test )
          ( cd zk/noir/silent_witness_helper && nargo test )

  conformance-vectors:
    name: Cross-layer conformance vectors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test runner
        run: pip install pytest

      - name: Vectors are byte-identical to their generator
        # A hand-edited corpus would silently weaken every layer's assertions.
        run: |
          python zk/vectors/generate_vectors.py --check
          python zk/vectors/generate_malformed_public_inputs.py --check

      - name: Python conformance runner
        working-directory: backend
        run: python -m pytest test_conformance_vectors.py -q

      - name: Python fuzz harness
        working-directory: backend
        run: python -m pytest test_verifier_fuzz.py -q
