name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      APP_ENV: testing
      CORS_ORIGINS: http://localhost:5173,http://localhost,http://127.0.0.1:5173
      DATABASE_URL: ""
      NOIR_WORKER_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install ffmpeg for video steganography tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements.txt
          .venv/bin/python -m pip install --requirement requirements-dev.txt
          .venv/bin/python -m pip install pytest pytest-cov

      - name: Run backend tests
        run: |
          set -o pipefail
          .venv/bin/python -m unittest discover -v 2>&1 | tee backend-test.log
          .venv/bin/python -m pytest -v --cov=. --cov-report=json:coverage.json 2>&1 | tee -a backend-test.log

      - name: Check backend coverage thresholds
        run: python3 ../devx/coverage/check_coverage.py --workspace backend --report coverage.json

      - name: Upload test failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-failure-${{ github.run_id }}
          path: backend/backend-test.log
          if-no-files-found: warn
          retention-days: 7
