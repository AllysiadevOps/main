name: SBOM and Provenance

# Generate a Software Bill of Materials for every release and attach the
# resulting CycloneDX documents to the GitHub Release as downloadable assets.
# SLSA provenance is generated via the slsa-github-generator reusable workflow
# (called as a separate workflow_call job, the only supported invocation mode).
#
# Privacy note: SBOMs describe *dependency* graphs, not evidence payloads.
# No media, witness values, credentials, proofs, or private deployment secrets
# are ever written to an SBOM artifact.

on:
  release:
    types:
      - published
      - prereleased
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to generate SBOM for (branch, tag, or SHA)'
        required: false
        default: 'main'
      upload_artifacts:
        description: 'Upload SBOM artifacts to the workflow run'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: read

concurrency:
  group: sbom-provenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SBOM_DIR: sbom-artifacts

jobs:
  sbom:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Expose the computed hashes so the downstream provenance job can consume
    # them without downloading the artifact a second time.
    outputs:
      hashes: ${{ steps.sbom-hashes.outputs.hashes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.3.0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Create SBOM output directory
        run: mkdir -p "$SBOM_DIR"

      # ── Per-workspace SBOMs (CycloneDX JSON) ─────────────────────────────

      - name: Generate backend SBOM (Python/pip)
        run: |
          syft dir:backend \
            --output cyclonedx-json \
            --file "$SBOM_DIR/backend-sbom.cdx.json"
          echo "Backend SBOM generated"

      - name: Generate frontend SBOM (npm)
        run: |
          syft dir:frontend \
            --output cyclonedx-json \
            --file "$SBOM_DIR/frontend-sbom.cdx.json"
          echo "Frontend SBOM generated"

      - name: Generate contracts SBOM (Cargo)
        run: |
          syft dir:contracts \
            --output cyclonedx-json \
            --file "$SBOM_DIR/contracts-sbom.cdx.json"
          echo "Contracts SBOM generated"

      - name: Generate zk SBOM (Noir/Cargo)
        run: |
          syft dir:zk \
            --output cyclonedx-json \
            --file "$SBOM_DIR/zk-sbom.cdx.json"
          echo "ZK SBOM generated"

      - name: Generate aggregate repository SBOM
        run: |
          syft dir:. \
            --output cyclonedx-json \
            --file "$SBOM_DIR/harpocrates-sbom.cdx.json"
          echo "Aggregate SBOM generated"

      # ── Hash computation (must come before any step that consumes hashes) ─

      - name: Compute SHA-256 hashes for provenance
        id: sbom-hashes
        run: |
          cd "$SBOM_DIR"
          # Build a newline-delimited "hash  filename" list, then base64-encode
          # it for the SLSA generator input format.
          HASH_LIST=$(sha256sum ./*.cdx.json)
          echo "hashes=$(echo "$HASH_LIST" | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "Computed hashes:"
          echo "$HASH_LIST"

      # ── Keyless signing via Sigstore ─────────────────────────────────────

      - name: Sign SBOMs with cosign (keyless, OIDC)
        if: github.event_name == 'release'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for sbom in "$SBOM_DIR"/*.cdx.json; do
            echo "Signing: $sbom"
            cosign sign-blob \
              --yes \
              --oidc-issuer "https://token.actions.githubusercontent.com" \
              --output-signature "${sbom}.sig" \
              --output-certificate "${sbom}.cert" \
              "$sbom"
          done
          echo "All SBOMs signed"

      # ── Upload and release attachment ────────────────────────────────────

      - name: Upload SBOM artifacts
        if: github.event_name == 'release' || inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-artifacts-${{ github.run_id }}
          path: ${{ env.SBOM_DIR }}/
          retention-days: 90
          if-no-files-found: error

      - name: Attach SBOMs to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          for sbom in "$SBOM_DIR"/*.cdx.json; do
            gh release upload "$TAG" "$sbom" --clobber
            # Upload signatures and certificates when they were produced.
            [ -f "${sbom}.sig"  ] && gh release upload "$TAG" "${sbom}.sig"  --clobber || true
            [ -f "${sbom}.cert" ] && gh release upload "$TAG" "${sbom}.cert" --clobber || true
          done
          echo "SBOMs attached to release $TAG"

  # SLSA level-3 provenance is generated by the official slsa-github-generator
  # reusable workflow.  This *must* be a separate top-level job — the generator
  # cannot be embedded as a step inside another job.
  provenance:
    name: Generate SLSA Provenance
    needs: sbom
    # Only run on real releases; skip for workflow_dispatch dry runs where
    # there is no release context and no hashes to attest.
    if: github.event_name == 'release'
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.sbom.outputs.hashes }}
      provenance-name: "harpocrates.intoto.jsonl"
      upload-assets: true

  # Verify signatures produced during the same run to catch toolchain regressions.
  verify:
    name: Verify SBOM Signatures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: sbom
    if: github.event_name == 'release'

    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          name: sbom-artifacts-${{ github.run_id }}
          path: ${{ env.SBOM_DIR }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify SBOM signatures
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          failed=0
          for sig in "$SBOM_DIR"/*.cdx.json.sig; do
            [ -f "$sig" ] || continue
            cert="${sig%.sig}.cert"
            sbom="${sig%.sig}"
            if [ -f "$cert" ]; then
              echo "Verifying: $sbom"
              if cosign verify-blob \
                --certificate "$cert" \
                --signature "$sig" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                --certificate-identity-regexp ".*" \
                "$sbom"; then
                echo "✓ $sbom signature verified"
              else
                echo "✗ $sbom signature verification failed"
                failed=1
              fi
            fi
          done
          exit $failed
