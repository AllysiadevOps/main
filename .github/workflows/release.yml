name: Release — Build and push Docker images

# Trigger on a published GitHub release (tag created through the UI or API).
# Images are tagged with both the semver release tag and "latest".
# Images are pushed to GitHub Container Registry (ghcr.io).
#
# SBOM and SLSA provenance for source dependencies are generated by the
# companion sbom-provenance.yml workflow which also fires on release:published.
# Docker image-level build provenance attestations are produced here, inline,
# immediately after each image push so the image digest is available.
#
# Required secrets (set in repo Settings → Secrets and variables → Actions):
#   VITE_API_BASE                — public URL of the deployed backend
#   VITE_STELLAR_RPC_URL         — Stellar RPC endpoint
#   VITE_STELLAR_READONLY_SOURCE — funded G… testnet account
#   VITE_HARPOCRATES_REGISTRY_ID — deployed contract ID (C…)
#
# GITHUB_TOKEN is automatically provided; no manual secret needed for ghcr.io push.

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write    # push to ghcr.io
  id-token: write    # keyless signing / build provenance attestations
  attestations: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository_owner }}/harpocrates-backend
  FRONTEND_IMAGE: ${{ github.repository_owner }}/harpocrates-frontend

jobs:
  build-backend:
    name: Build and push backend image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        id: push-backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Attest backend image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.push-backend.outputs.digest }}
          push-to-registry: true

  build-frontend:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend
        id: push-frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # VITE_* values are baked into the static bundle at build time.
          # Store these in GitHub Actions secrets, not variables, since they
          # include account addresses and contract IDs.
          build-args: |
            VITE_API_BASE=${{ secrets.VITE_API_BASE }}
            VITE_STELLAR_RPC_URL=${{ secrets.VITE_STELLAR_RPC_URL }}
            VITE_STELLAR_READONLY_SOURCE=${{ secrets.VITE_STELLAR_READONLY_SOURCE }}
            VITE_HARPOCRATES_REGISTRY_ID=${{ secrets.VITE_HARPOCRATES_REGISTRY_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Attest frontend image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.push-frontend.outputs.digest }}
          push-to-registry: true

  publish-sdk:
    name: Publish SDK to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        working-directory: ./cli
        run: npm ci
        
      - name: Build SDK
        working-directory: ./cli
        run: npm run build
        
      - name: Publish to npm
        working-directory: ./cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
