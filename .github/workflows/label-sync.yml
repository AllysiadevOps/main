name: Label sync

# Keeps repository labels in sync with .github/labels.yml.
# Runs on every push to main that touches either the labels definition or
# this workflow, and on workflow_dispatch so maintainers can resync manually.
#
# Privacy / security notes:
#   - No secrets are read; GITHUB_TOKEN requires labels:write only.
#   - delete_missing is disabled so that labels managed outside this file
#     (e.g. bot-applied or GitHub-default labels) are not silently removed.
#     To purge a label, delete it manually or temporarily set delete_missing:
#     true on a targeted workflow_dispatch run.

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/label-sync.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # labels:write lives under the issues permission scope

concurrency:
  group: label-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync labels from .github/labels.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate label config before syncing
        run: |
          python3 devx/label_config.py --check .github/labels.yml

      - name: Sync labels
        uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          # delete_missing is intentionally false: labels not present in
          # labels.yml (e.g. GitHub defaults, bot labels) are left untouched.
          # Flip to true on a manual workflow_dispatch run only when a
          # deliberate purge is needed.
          delete_missing: false
          token: ${{ secrets.GITHUB_TOKEN }}
