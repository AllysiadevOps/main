server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Security headers ────────────────────────────────────────────────────────

  # Prevent MIME-type sniffing
  add_header X-Content-Type-Options "nosniff" always;

  # Don't send the referrer to cross-origin pages
  add_header Referrer-Policy "no-referrer" always;

  # Forbid framing from other origins (clickjacking defence)
  add_header X-Frame-Options "DENY" always;

  # Restrict cross-origin resource sharing at the browser level
  add_header Cross-Origin-Resource-Policy "same-site" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # SharedArrayBuffer (required by bb.js / Barretenberg WASM threads) needs
  # cross-origin isolation.  The two headers above enable that isolation.
  add_header Cross-Origin-Embedder-Policy "require-corp" always;

  # Content-Security-Policy
  # - default-src 'self'               only same-origin resources by default
  # - script-src  'self' 'wasm-unsafe-eval'  allow WASM instantiation (bb.js)
  # - worker-src  blob:                Barretenberg spawns WASM workers via blob URLs
  # - connect-src 'self' … Stellar testnet RPC and backend API
  # - style-src   'self' 'unsafe-inline'  React injects inline styles
  # - img-src     'self' data:          SVG / data URIs used in the UI
  # - frame-ancestors 'none'           belt-and-suspenders framing block
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src blob:; connect-src 'self' https: wss:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

  # ── Static asset caching ────────────────────────────────────────────────────

  # Circuit artifacts have stable, unhashed names (e.g. /noir/silent_witness.json).
  # Require revalidation with ETag / 304 on each load so updated circuits reach users immediately.
  location ^~ /noir/ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src blob:; connect-src 'self' https: wss:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    try_files $uri =404;
  }

  location ~* \.wasm$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Type "application/wasm";
    # Repeat security headers — nginx add_header only inherits into a block
    # when no other add_header appears in the same block, so we must repeat.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src blob:; connect-src 'self' https: wss:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    try_files $uri =404;
  }

  # Vite's content-hashed production assets
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src blob:; connect-src 'self' https: wss:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    try_files $uri =404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src blob:; connect-src 'self' https: wss:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    try_files $uri =404;
  }

  # ── SPA fallback ─────────────────────────────────────────────────────────────

  location / {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src blob:; connect-src 'self' https: wss:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    try_files $uri $uri/ /index.html;
  }
}
